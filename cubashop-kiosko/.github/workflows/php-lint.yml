name: Kiosko PHP lint

on:
  push:
    paths:
      - 'cubashop-kiosko/backend/**/*.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'cubashop-kiosko/backend/**/*.php'
      - '.github/workflows/php-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax check
        shell: bash
        run: |
          set -e
          find cubashop-kiosko/backend -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
