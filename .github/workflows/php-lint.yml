name: PHP lint

on:
  push:
    paths:
      - 'cubashop-kiosko/**/*.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'cubashop-kiosko/**/*.php'
      - '.github/workflows/php-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          find cubashop-kiosko -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
